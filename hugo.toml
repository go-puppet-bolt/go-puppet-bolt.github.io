baseURL = "https://go-puppet-bolt.github.io/"
title = "go-puppet-bolt"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Inventory (v2)"
  status = "ready"
  blurb = "Targets, nested groups, per-group / per-target `config` / `facts` / `vars` / `features`, effective-value resolution through the hierarchy (deep merge, closest group wins, target overrides all), and target selection by name / alias / group / glob (`TargetsForQuery`)."
[[params.phases]]
  name = "Tasks"
  status = "ready"
  blurb = "Parses the Bolt task `*.json` metadata shape (typed `parameters`, `input_method`, `supports_noop`, `implementations`, `files`) and validates arguments against the declared parameter types."
[[params.phases]]
  name = "YAML plans"
  status = "ready"
  blurb = "`plan.yaml` `parameters` plus an ordered list of `task` / `command` / `script` / `eval` / `plan` / `resources` / `message` steps with `targets`, per-step parameters and a `return` expression, executed by a step runner."
[[params.phases]]
  name = "Transports & executor"
  status = "ready"
  blurb = "A `Transport` interface with a host-local `LocalTransport` driven through an injectable `CommandRunner` seam; an `Executor` runs a command, script or task across a set of targets, collecting a per-target `Result` into a `ResultSet`."
[[params.phases]]
  name = "SSH / WinRM & Puppet-language plans"
  status = "planned"
  blurb = "Only `LocalTransport` ships (`Transport` is the extension point); SSH / WinRM transports, Puppet-language (`.pp`) plans, `apply` / `resources` steps and PuppetDB inventory references are documented deferrals."
