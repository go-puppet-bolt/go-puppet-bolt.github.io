baseURL = "https://go-puppet-bolt.github.io/"
title = "go-puppet-bolt"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Inventory (v2)"
  status = "ready"
  blurb = "Targets, nested groups, per-group / per-target `config` / `facts` / `vars` / `features`, effective-value resolution through the hierarchy (deep merge, closest group wins, target overrides all), and target selection by name / alias / group / glob (`TargetsForQuery`)."
[[params.phases]]
  name = "Tasks"
  status = "ready"
  blurb = "Parses the Bolt task `*.json` metadata shape (typed `parameters`, `input_method`, `supports_noop`, `implementations`, `files`) and validates arguments against the declared parameter types."
[[params.phases]]
  name = "YAML plans"
  status = "ready"
  blurb = "`plan.yaml` `parameters` plus an ordered list of `task` / `command` / `script` / `eval` / `plan` / `resources` / `message` steps with `targets`, per-step parameters and a `return` expression, executed by a step runner."
[[params.phases]]
  name = "Transports & executor"
  status = "ready"
  blurb = "A `Transport` interface with a host-local `LocalTransport` (injectable `CommandRunner` seam), a full pure-Go **SSH** transport (`SSHTransport`, over `golang.org/x/crypto/ssh`) and a full pure-Go **WinRM** transport (`WinRMTransport`, WS-Management over `net/http`, with `basic` / `negotiate` (NTLM) / `ssl` auth); an `Executor` runs a command, script or task across targets into a `ResultSet`."
[[params.phases]]
  name = "Puppet-language plans & apply"
  status = "ready"
  blurb = "Puppet-language (`.pp`) plans run through `go-puppet/puppet` (`RunPuppetPlan`), with `run_task` / `run_command` / `run_script` / `get_targets` / `apply` dispatched to real targets; `apply` blocks and the `resources` step compile a catalog and report (`ApplyCatalog`). Remote resource enforcement (needs a Puppet agent), WinRM Kerberos/CredSSP and PuppetDB `_plugin` resolvers are documented boundaries."
